name: docs-drift

on:
  pull_request:
    paths:
      - "docs/**"
      - "skills/**"
      - "AGENTS.md"
      - "README.md"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/run_tests.py
