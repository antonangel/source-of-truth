name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite includes the golden fixtures, the real-world noise fixture, the 600-document
      # inventory speed budget, and a self-inventory of this repository.
      - run: python3 tests/run_tests.py
